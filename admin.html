<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuzu — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e0e; --surface: #161616; --surface2: #1f1f1f; --border: #2a2a2a;
    --text: #f0f0f0; --muted: #888; --accent: #c8f135; --accent-dark: #9db82a;
    --radius: 10px; --font: 'Space Grotesk', sans-serif; --mono: 'Space Mono', monospace;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 24px 16px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .logo { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
  input[type="text"], input[type="password"], select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 12px; font-family: var(--font); font-size: 14px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .btn { width: 100%; background: var(--accent); color: #0e0e0e; border: none; border-radius: var(--radius);
    padding: 14px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.15s; margin-top: 18px;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 13px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; display: none; }
  .status.show { display: block; }
  .status.ok { background: rgba(200,241,53,0.1); color: var(--accent); border: 1px solid var(--accent); }
  .status.err { background: rgba(255,85,85,0.1); color: #ff5555; border: 1px solid #ff5555; }
  .status.loading { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .token-ok { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent); }
  .token-ok button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; margin-left: auto; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">YUZU · ADMIN</div>
  <div class="subtitle">Subir productos al catálogo</div>

  <div class="card" id="setupCard">
    <h2>Configuración (una sola vez)</h2>
    <label>Tu usuario de GitHub</label>
    <input type="text" id="owner" placeholder="ej: YuzuCR">
    <label>Nombre del repositorio</label>
    <input type="text" id="repo" placeholder="ej: Yuzu-Catalogo">
    <label>Token de acceso de GitHub</label>
    <input type="password" id="token" placeholder="github_pat_xxxxx">
    <button class="btn" onclick="guardarConfig()">Guardar configuración</button>
  </div>

  <div class="card" id="configOk" style="display:none;">
    <div class="token-ok">
      ✓ Configuración guardada
      <button onclick="borrarConfig()">cambiar</button>
    </div>
  </div>

  <div class="card" id="formCard" style="display:none;">
    <h2>Nuevo producto</h2>
    <label>Nombre</label>
    <input type="text" id="nombre" placeholder="ej: Eren Yeager">
    <label>Categoría</label>
    <select id="cat"></select>
    <label>Precio</label>
    <input type="text" id="precio" value="19500" inputmode="numeric">
    <button class="btn" id="btn" onclick="enviar()">Subir producto</button>
    <div class="status" id="status"></div>
  </div>
</div>

<script>
function guardarConfig() {
  const o = document.getElementById('owner').value.trim();
  const r = document.getElementById('repo').value.trim();
  const t = document.getElementById('token').value.trim();
  if (!o || !r || !t) { alert('Completá los 3 campos'); return; }
  localStorage.setItem('yuzu_owner', o);
  localStorage.setItem('yuzu_repo', r);
  localStorage.setItem('yuzu_token', t);
  mostrarConfig();
}

function borrarConfig() {
  localStorage.clear();
  mostrarConfig();
}

function mostrarConfig() {
  const o = localStorage.getItem('yuzu_owner');
  const r = localStorage.getItem('yuzu_repo');
  const t = localStorage.getItem('yuzu_token');
  if (o && r && t) {
    document.getElementById('setupCard').style.display = 'none';
    document.getElementById('configOk').style.display = 'block';
    document.getElementById('formCard').style.display = 'block';
  } else {
    document.getElementById('setupCard').style.display = 'block';
    document.getElementById('configOk').style.display = 'none';
    document.getElementById('formCard').style.display = 'none';
  }
}

async function ghGet(path) {
  const o = localStorage.getItem('yuzu_owner');
  const r = localStorage.getItem('yuzu_repo');
  const t = localStorage.getItem('yuzu_token');
  const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/${path}`, {
    headers: { Authorization: `token ${t}` }
  });
  if (!res.ok) throw new Error(`Error leyendo ${path}`);
  const data = await res.json();
  return { content: JSON.parse(atob(data.content)), sha: data.sha };
}

async function ghPut(path, obj, sha, msg) {
  const o = localStorage.getItem('yuzu_owner');
  const r = localStorage.getItem('yuzu_repo');
  const t = localStorage.getItem('yuzu_token');
  const content = btoa(JSON.stringify(obj, null, 2));
  const body = { message: msg, content };
  if (sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${o}/${r}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `token ${t}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error('Error guardando');
  return await res.json();
}

async function cargarCats() {
  try {
    const { content } = await ghGet('data/categorias.json');
    const sel = document.getElementById('cat');
    sel.innerHTML = Object.keys(content).map(c => `<option value="${c}">${c}</option>`).join('');
  } catch (e) {
    alert('Error cargando categorías');
  }
}

function mostrarStatus(tipo, msg) {
  const el = document.getElementById('status');
  el.className = `status show ${tipo}`;
  el.textContent = msg;
}

async function enviar() {
  const nombre = document.getElementById('nombre').value.trim();
  const cat = document.getElementById('cat').value;
  const precio = parseInt(document.getElementById('precio').value.replace(/\D/g, ''));
  
  if (!nombre || !cat || !precio) { alert('Completá todos los campos'); return; }
  
  const btn = document.getElementById('btn');
  btn.disabled = true;
  
  try {
    mostrarStatus('loading', 'Guardando...');
    const prod = await ghGet('data/products.json');
    prod.content.push({
      id: Date.now(),
      nombre, categoria: cat, imagenes: [], mockups: {}, colores: ['Blanco', 'Negro', 'Crema', 'Café', 'Gris grafito', 'Azul marino', 'Verde musgo'],
      precio, enDescuento: false, precioDescuento: null
    });
    await ghPut('data/products.json', prod.content, prod.sha, `Nuevo: ${nombre}`);
    mostrarStatus('ok', `✓ "${nombre}" creado`);
    document.getElementById('nombre').value = '';
    document.getElementById('precio').value = '19500';
  } catch (e) {
    mostrarStatus('err', 'Error: ' + e.message);
  } finally {
    btn.disabled = false;
  }
}

mostrarConfig();
if (localStorage.getItem('yuzu_token')) cargarCats();
</script>
</body>
</html>
