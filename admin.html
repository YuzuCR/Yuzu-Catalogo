<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuzu — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #100f0d; --sup: #1a1815; --sup2: #232019; --linea: #2f2b24;
    --tinta: #ece7db; --mudo: #857f72; --yuzu: #c3c24d; --yuzu2: #9d9c3c; --rojo: #d1725a;
    --font: 'Archivo', sans-serif; --mono: 'Space Mono', monospace;
  }
  body { background: var(--bg); color: var(--tinta); font-family: var(--font); min-height: 100vh; padding: 22px 14px 60px; font-size: 15px; }
  .wrap { max-width: 520px; margin: 0 auto; }
  .logo { font-family: var(--mono); font-size: 18px; font-weight: 700; color: var(--yuzu); letter-spacing: .04em; }
  .subtitle { color: var(--mudo); font-size: 12px; margin-bottom: 24px; }

  .card { background: var(--sup); border: 1px solid var(--linea); border-radius: 10px; padding: 18px; margin-bottom: 14px; }
  .card h2 { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--mudo); margin-bottom: 14px; }

  label { display: block; font-size: 11px; color: var(--mudo); margin: 16px 0 6px; letter-spacing: .04em; }
  input[type="text"], input[type="password"], select {
    width: 100%; background: var(--sup2); border: 1px solid var(--linea); color: var(--tinta);
    border-radius: 7px; padding: 11px; font-family: var(--font); font-size: 14px; outline: none;
  }
  input:focus, select:focus { border-color: var(--yuzu); }
  select { cursor: pointer; }

  .file-drop { border: 1px dashed var(--linea); border-radius: 8px; padding: 16px; text-align: center; cursor: pointer; color: var(--mudo); font-size: 12px; transition: border-color .2s; }
  .file-drop:hover { border-color: var(--yuzu); color: var(--tinta); }
  .hidden-input { display: none; }

  .preview-grid { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
  .preview-item { position: relative; width: 88px; border-radius: 7px; overflow: hidden; border: 1px solid var(--linea); background: var(--sup2); }
  .preview-item .thumb { width: 100%; height: 72px; object-fit: cover; display: block; }
  .preview-item .rm { position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,.8); color: #fff; border: none; border-radius: 50%; width: 19px; height: 19px; font-size: 11px; cursor: pointer; line-height: 1; }
  .preview-item .tag { display: block; font-size: 9px; text-align: center; padding: 3px 0; color: var(--yuzu); font-family: var(--mono); }
  .preview-item select { padding: 3px; font-size: 10px; border-radius: 0; border: none; border-top: 1px solid var(--linea); }

  .btn { width: 100%; background: var(--yuzu); color: #100f0d; border: none; border-radius: 8px; padding: 13px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s; margin-top: 18px; }
  .btn:hover { background: var(--yuzu2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-sec { background: var(--sup2); color: var(--tinta); border: 1px solid var(--linea); }
  .btn-sec:hover { background: var(--sup2); border-color: var(--yuzu); }

  .status { font-size: 12px; margin-top: 11px; padding: 9px 11px; border-radius: 7px; display: none; }
  .status.show { display: block; }
  .status.ok { background: rgba(195,194,77,.1); color: var(--yuzu); border: 1px solid var(--yuzu); }
  .status.err { background: rgba(209,114,90,.1); color: var(--rojo); border: 1px solid var(--rojo); }
  .status.loading { background: var(--sup2); color: var(--mudo); border: 1px solid var(--linea); }

  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row input { flex: 1; }
  .row button { flex-shrink: 0; width: auto; margin: 0; padding: 11px 15px; }

  .token-ok { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--yuzu); }
  .token-ok button { background: none; border: none; color: var(--mudo); text-decoration: underline; cursor: pointer; font-size: 12px; margin-left: auto; }

  .color-check-grid { display: flex; gap: 9px; flex-wrap: wrap; }
  .color-check { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; width: 50px; }
  .color-check input { width: auto; margin: 0; }
  .color-check .swatch { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--linea); }
  .color-check .lbl { font-size: 9px; color: var(--mudo); text-align: center; line-height: 1.2; }

  .check-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; cursor: pointer; }
  .check-row input { width: auto; }
  .check-row span { font-size: 13px; color: var(--tinta); }
  .banderas { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 14px; }
  .banderas .check-row { margin-top: 0; font-size: 12px; }
  .banderas .check-row span { font-size: 12px; }

  /* ---- lista de productos ---- */
  .prod-row { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid var(--linea); }
  .prod-row.off { opacity: .42; }
  .prod-thumb { width: 42px; height: 42px; border-radius: 5px; object-fit: cover; background: var(--sup2); flex-shrink: 0; }
  .prod-info { flex: 1; min-width: 0; }
  .prod-nombre { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prod-meta { font-size: 11px; color: var(--mudo); }
  .prod-meta .tachado { text-decoration: line-through; margin-right: 5px; }
  .prod-meta .vigente { color: var(--yuzu); }
  .chip { font-family: var(--mono); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--linea); border-radius: 20px; padding: 1px 6px; margin-left: 5px; color: var(--mudo); }
  .chip.dest { color: var(--yuzu); border-color: var(--yuzu); }
  .chip.ago { color: var(--rojo); border-color: var(--rojo); }
  .prod-btn { background: var(--sup2); border: 1px solid var(--linea); color: var(--mudo); border-radius: 6px; width: 30px; height: 30px; cursor: pointer; font-size: 13px; flex-shrink: 0; }
  .prod-btn:hover { border-color: var(--yuzu); color: var(--tinta); }
  .prod-btn.del:hover { border-color: var(--rojo); color: var(--rojo); }

  .prod-edit { background: var(--sup2); border: 1px solid var(--linea); border-radius: 9px; padding: 14px; margin: 8px 0 14px; }
  .prod-edit label { margin-top: 14px; }
  .prod-edit > label:first-child { margin-top: 0; }
  .prod-edit .btn { margin-top: 14px; }

  /* ---- gestor de imágenes ---- */
  .im-grid { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .im-item { position: relative; width: 66px; height: 84px; border-radius: 6px; overflow: hidden; border: 1px solid var(--linea); background: var(--bg); }
  .im-item img { width: 100%; height: 100%; object-fit: cover; }
  .im-item button { position: absolute; background: rgba(0,0,0,.82); color: #fff; border: none; border-radius: 50%; width: 19px; height: 19px; font-size: 10px; line-height: 1; cursor: pointer; padding: 0; }
  .im-item .im-rm { top: 3px; right: 3px; }
  .im-item .im-rm:hover { background: var(--rojo); }
  .im-item .im-star { top: 3px; left: 3px; color: var(--yuzu); }
  .im-item .im-tag { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,.75); color: var(--yuzu); font-family: var(--mono); font-size: 8px; text-align: center; padding: 2px 0; }
  .im-add { width: 66px; height: 84px; border: 1px dashed var(--linea); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--mudo); cursor: pointer; }
  .im-add:hover { border-color: var(--yuzu); color: var(--yuzu); }
  .im-add input { display: none; }

  .mock-block { border-top: 1px solid var(--linea); padding-top: 10px; margin-top: 10px; }
  .mock-head { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--mudo); }
  .mock-head .sw { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--linea); }
  .subtit { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--mudo); margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--linea); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">YUZU · ADMIN</div>
  <div class="subtitle">Subir y editar el catálogo</div>

  <div class="card" id="setupCard">
    <h2>Configuración (una sola vez)</h2>
    <label>Tu usuario de GitHub</label>
    <input type="text" id="repoOwner" placeholder="ej: YuzuCR">
    <label>Nombre del repositorio</label>
    <input type="text" id="repoName" placeholder="ej: Yuzu-Catalogo">
    <label>Token de acceso de GitHub</label>
    <input type="password" id="ghToken" placeholder="github_pat_xxxxx">
    <button class="btn" id="btnGuardarConfig">Guardar configuración</button>
  </div>

  <div class="card" id="configOk" style="display:none;">
    <div class="token-ok">
      ✓ Configuración guardada en este navegador
      <button id="btnBorrarConfig">cambiar</button>
    </div>
  </div>

  <div class="card" id="formCard" style="display:none;">
    <h2>Nuevo producto</h2>

    <label>Fotos del diseño — galería (espalda, frente, lateral, modelo)</label>
    <div class="file-drop" id="dropGaleria">Tocá para elegir fotos</div>
    <input type="file" id="inputGaleria" class="hidden-input" accept="image/*" multiple>
    <div class="preview-grid" id="gridGaleria"></div>

    <label>Mockups por color (poné el color en el nombre del archivo)</label>
    <div class="file-drop" id="dropMockups">Tocá para elegir mockups</div>
    <input type="file" id="inputMockups" class="hidden-input" accept="image/*" multiple>
    <div class="preview-grid" id="gridMockups"></div>

    <label>Nombre del diseño</label>
    <input type="text" id="nombreProducto" placeholder="ej: Eren 001">

    <label>Categoría</label>
    <select id="categoriaSelect"></select>
    <div class="row" id="rowNuevaCat" style="display:none;">
      <input type="text" id="inputNuevaCat" placeholder="Nombre de la nueva categoría">
      <button class="btn btn-sec" id="btnNuevaCat">Crear</button>
    </div>

    <label>Subcategoría (la serie) — opcional</label>
    <select id="subcategoriaSelect"></select>
    <div class="row" id="rowNuevaSubcat" style="display:none;">
      <input type="text" id="inputNuevaSubcat" placeholder="ej: Attack on Titan">
      <button class="btn btn-sec" id="btnNuevaSubcat">Crear</button>
    </div>

    <label>Colores disponibles</label>
    <div class="color-check-grid" id="colorCheckGrid"></div>

    <label>Tipo de impresión</label>
    <select id="impresionSelect">
      <option value="espalda">Espalda grande + pecho pequeño — ₡19.500</option>
      <option value="pecho">Solo pecho — ₡14.500</option>
    </select>

    <label>Precio</label>
    <input type="text" id="precioInput" value="19500" inputmode="numeric">

    <label class="check-row">
      <input type="checkbox" id="descuentoCheck">
      <span>Está en descuento</span>
    </label>
    <div id="rowDescuento" style="display:none;">
      <label>Precio con descuento</label>
      <input type="text" id="precioDescuentoInput" inputmode="numeric" placeholder="ej: 15500">
    </div>

    <div class="banderas">
      <label class="check-row"><input type="checkbox" id="nuevoDestacado"><span>Destacado</span></label>
      <label class="check-row"><input type="checkbox" id="nuevoAgotado"><span>Agotado</span></label>
      <label class="check-row"><input type="checkbox" id="nuevoOculto"><span>Oculto</span></label>
    </div>

    <button class="btn" id="btnSubir">Subir producto</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card" id="editCard" style="display:none;">
    <h2>Editar productos</h2>
    <div class="row" style="margin-top:0;">
      <button class="btn btn-sec" id="btnRecargar" style="margin-top:0;">Recargar lista</button>
      <button class="btn btn-sec" id="btnQuitarDesc" style="margin-top:0;">Quitar todos los descuentos</button>
    </div>
    <div id="listaProductos" style="margin-top:14px;"></div>
    <div class="status" id="statusEdit"></div>
  </div>
</div>

<script>
var COLORES = [
  { name: 'Blanco', hex: '#ffffff' },
  { name: 'Negro', hex: '#1a1a1a' },
  { name: 'Crema', hex: '#f0e6d2' },
  { name: 'Café', hex: '#6b4a35' },
  { name: 'Gris grafito', hex: '#4a4a4a' },
  { name: 'Azul marino', hex: '#1b3a5c' },
  { name: 'Verde musgo', hex: '#4a6741' }
];

var CATEGORIAS = {};
var galeria = [];
var mockups = [];
var PRODUCTOS = [];

function $(id) { return document.getElementById(id); }

function normalizar(str) {
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
}
function detectarColor(nombreArchivo) {
  var n = normalizar(nombreArchivo);
  for (var i = 0; i < COLORES.length; i++) {
    if (n.indexOf(normalizar(COLORES[i].name)) !== -1) return COLORES[i].name;
  }
  return null;
}
function slugify(str) {
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
function plata(n) { return '₡' + Number(n).toLocaleString('es-CR'); }
function mostrarStatus(tipo, msg) {
  var el = $('status'); el.className = 'status show ' + tipo; el.textContent = msg;
}
function statusEdit(tipo, msg) {
  var el = $('statusEdit'); el.className = 'status show ' + tipo; el.textContent = msg;
}

/* ---------- CONFIG ---------- */
function guardarConfig() {
  var owner = $('repoOwner').value.trim();
  var repo = $('repoName').value.trim();
  var token = $('ghToken').value.trim();
  if (!owner || !repo || !token) { alert('Completá los 3 campos.'); return; }
  localStorage.setItem('yuzu_owner', owner);
  localStorage.setItem('yuzu_repo', repo);
  localStorage.setItem('yuzu_token', token);
  mostrarEstadoConfig();
}
function borrarConfig() {
  localStorage.removeItem('yuzu_owner');
  localStorage.removeItem('yuzu_repo');
  localStorage.removeItem('yuzu_token');
  mostrarEstadoConfig();
}
function getConfig() {
  return {
    owner: localStorage.getItem('yuzu_owner'),
    repo: localStorage.getItem('yuzu_repo'),
    token: localStorage.getItem('yuzu_token')
  };
}
function mostrarEstadoConfig() {
  var cfg = getConfig();
  if (cfg.owner && cfg.repo && cfg.token) {
    $('setupCard').style.display = 'none';
    $('configOk').style.display = 'block';
    $('formCard').style.display = 'block';
    $('editCard').style.display = 'block';
    renderColorChecks();
    cargarCategorias().then(cargarProductos);
  } else {
    $('setupCard').style.display = 'block';
    $('configOk').style.display = 'none';
    $('formCard').style.display = 'none';
    $('editCard').style.display = 'none';
  }
}

/* ---------- GITHUB API ---------- */
function urlDe(path) {
  var cfg = getConfig();
  return 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + path;
}
function errorDeRespuesta(res, contexto) {
  return res.json().catch(function () { return {}; }).then(function (err) {
    var detalle = err.message || '';
    if (err.errors && err.errors.length && err.errors[0].message) detalle += ' — ' + err.errors[0].message;
    throw new Error(contexto + ' (' + res.status + ') ' + detalle);
  });
}
function ghGet(path) {
  return fetch(urlDe(path), { headers: { Authorization: 'token ' + getConfig().token } })
    .then(function (res) {
      if (!res.ok) return errorDeRespuesta(res, 'No pude leer ' + path);
      return res.json();
    }).then(function (data) {
      var texto = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
      return { content: JSON.parse(texto), sha: data.sha };
    });
}
function ghPut(path, obj, sha, message) {
  var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(obj, null, 2))));
  var body = { message: message, content: encoded };
  if (sha) body.sha = sha;
  return fetch(urlDe(path), {
    method: 'PUT',
    headers: { Authorization: 'token ' + getConfig().token, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (res) {
    if (!res.ok) return errorDeRespuesta(res, 'Error guardando ' + path);
    return res.json();
  });
}
function ghPutImage(path, base64, message) {
  return fetch(urlDe(path), {
    method: 'PUT',
    headers: { Authorization: 'token ' + getConfig().token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: message, content: base64 })
  }).then(function (res) {
    if (!res.ok) return errorDeRespuesta(res, 'Error subiendo ' + path);
    return res.json();
  });
}
/* Borra el archivo del repo. Si falla, seguimos igual: lo importante
   es que la foto ya no aparece en el catálogo. */
function ghBorrarArchivo(path, message) {
  return fetch(urlDe(path), { headers: { Authorization: 'token ' + getConfig().token } })
    .then(function (res) { return res.ok ? res.json() : null; })
    .then(function (data) {
      if (!data || !data.sha) return null;
      return fetch(urlDe(path), {
        method: 'DELETE',
        headers: { Authorization: 'token ' + getConfig().token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message, sha: data.sha })
      });
    }).catch(function () { return null; });
}

/* ---------- CATEGORIAS ---------- */
function cargarCategorias() {
  return ghGet('data/categorias.json').then(function (r) {
    CATEGORIAS = r.content;
    renderCategorias();
  }).catch(function (e) {
    mostrarStatus('err', 'No pude cargar las categorías: ' + e.message);
  });
}
function renderCategorias() {
  var sel = $('categoriaSelect'), html = '', cats = Object.keys(CATEGORIAS);
  for (var i = 0; i < cats.length; i++) html += '<option value="' + cats[i] + '">' + cats[i] + '</option>';
  html += '<option value="__nueva__">+ Crear nueva categoría</option>';
  sel.innerHTML = html;
  renderSubcategorias();
}
function renderSubcategorias() {
  var cat = $('categoriaSelect').value, sel = $('subcategoriaSelect');
  if (cat === '__nueva__' || !CATEGORIAS[cat]) {
    sel.innerHTML = '<option value="">— ninguna —</option>';
    $('rowNuevaSubcat').style.display = 'none';
    return;
  }
  var subs = CATEGORIAS[cat] || [], html = '<option value="">— ninguna —</option>';
  for (var i = 0; i < subs.length; i++) html += '<option value="' + subs[i] + '">' + subs[i] + '</option>';
  html += '<option value="__nueva__">+ Crear nueva subcategoría</option>';
  sel.innerHTML = html;
}
function crearCategoria() {
  var nueva = $('inputNuevaCat').value.trim();
  if (!nueva) return;
  if (!CATEGORIAS[nueva]) CATEGORIAS[nueva] = [];
  renderCategorias();
  $('categoriaSelect').value = nueva;
  $('rowNuevaCat').style.display = 'none';
  $('inputNuevaCat').value = '';
  renderSubcategorias();
}
function crearSubcategoria() {
  var nueva = $('inputNuevaSubcat').value.trim();
  if (!nueva) return;
  var cat = $('categoriaSelect').value;
  if (!CATEGORIAS[cat]) CATEGORIAS[cat] = [];
  if (CATEGORIAS[cat].indexOf(nueva) === -1) CATEGORIAS[cat].push(nueva);
  renderSubcategorias();
  $('subcategoriaSelect').value = nueva;
  $('rowNuevaSubcat').style.display = 'none';
  $('inputNuevaSubcat').value = '';
}

/* ---------- COLORES ---------- */
function renderColorChecks() {
  var html = '';
  for (var i = 0; i < COLORES.length; i++) {
    var c = COLORES[i];
    var sombra = c.name === 'Blanco' ? 'inset 0 0 0 1px #444' : 'none';
    html += '<label class="color-check"><input type="checkbox" value="' + c.name + '" checked>' +
      '<span class="swatch" style="background:' + c.hex + '; box-shadow:' + sombra + ';"></span>' +
      '<span class="lbl">' + c.name + '</span></label>';
  }
  $('colorCheckGrid').innerHTML = html;
}
function coloresMarcados() {
  var inputs = document.querySelectorAll('#colorCheckGrid input:checked'), out = [];
  for (var i = 0; i < inputs.length; i++) out.push(inputs[i].value);
  return out;
}

/* ---------- COMPRESIÓN ---------- */
var MAX_LADO = 1400, CALIDAD = 0.88;

function comprimirImagen(file, callback) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var w = img.width, h = img.height;
      if (w > MAX_LADO || h > MAX_LADO) {
        if (w >= h) { h = Math.round(h * MAX_LADO / w); w = MAX_LADO; }
        else { w = Math.round(w * MAX_LADO / h); h = MAX_LADO; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', CALIDAD);
      var base64 = dataUrl.split(',')[1];
      callback({
        base64: base64, ext: 'jpg', preview: dataUrl, nombre: file.name,
        color: detectarColor(file.name), peso: Math.round(base64.length * 0.75 / 1024)
      });
    };
    img.onerror = function () { callback(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { callback(null); };
  reader.readAsDataURL(file);
}

function comprimirVarias(fileList) {
  var files = Array.prototype.slice.call(fileList);
  return Promise.all(files.map(function (f) {
    return new Promise(function (res) { comprimirImagen(f, res); });
  })).then(function (arr) { return arr.filter(Boolean); });
}

function leerArchivos(fileList, destino, callback) {
  if (!fileList.length) return;
  mostrarStatus('loading', 'Optimizando ' + fileList.length + ' imagen(es)...');
  comprimirVarias(fileList).then(function (items) {
    items.forEach(function (it) { destino.push(it); });
    callback();
    $('status').className = 'status';
  });
}

function renderGaleria() {
  var html = '';
  for (var i = 0; i < galeria.length; i++) {
    html += '<div class="preview-item"><img class="thumb" src="' + galeria[i].preview + '">' +
      '<button class="rm" data-tipo="galeria" data-i="' + i + '">✕</button>' +
      '<span class="tag">' + (i === 0 ? 'principal' : 'foto ' + (i + 1)) + ' · ' + galeria[i].peso + 'kb</span></div>';
  }
  $('gridGaleria').innerHTML = html;
}
function renderMockups() {
  var html = '';
  for (var i = 0; i < mockups.length; i++) {
    var m = mockups[i];
    html += '<div class="preview-item"><img class="thumb" src="' + m.preview + '">' +
      '<button class="rm" data-tipo="mockup" data-i="' + i + '">✕</button>' +
      '<select data-i="' + i + '" class="mockup-color"><option value="">— sin color —</option>';
    for (var j = 0; j < COLORES.length; j++) {
      html += '<option value="' + COLORES[j].name + '"' + (m.color === COLORES[j].name ? ' selected' : '') + '>' + COLORES[j].name + '</option>';
    }
    html += '</select></div>';
  }
  $('gridMockups').innerHTML = html;
}

/* ---------- SUBIR PRODUCTO NUEVO ---------- */
function subirProducto() {
  var nombre = $('nombreProducto').value.trim();
  var categoria = $('categoriaSelect').value;
  var subcategoria = $('subcategoriaSelect').value;

  if (!nombre) { alert('Ponele nombre al diseño.'); return; }
  if (!categoria || categoria === '__nueva__') { alert('Elegí o creá una categoría.'); return; }
  if (subcategoria === '__nueva__') { alert('Confirmá la subcategoría nueva o elegí — ninguna —.'); return; }
  if (galeria.length === 0 && mockups.length === 0) { alert('Subí al menos una foto.'); return; }

  var colores = coloresMarcados();
  if (colores.length === 0) { alert('Marcá al menos un color disponible.'); return; }
  for (var i = 0; i < mockups.length; i++) {
    if (!mockups[i].color) { alert('El mockup ' + (i + 1) + ' no tiene color asignado.'); return; }
  }

  var precio = parseInt($('precioInput').value.replace(/\D/g, ''), 10);
  if (!precio || precio <= 0) { alert('Poné un precio válido.'); return; }

  if (categoria === 'Manifiesto' && precio < 19500) {
    if (!confirm('Las piezas de Manifiesto donan ₡5.555. Debajo de ₡19.500 casi no te queda margen. ¿Subirla igual?')) return;
  }

  var enDescuento = $('descuentoCheck').checked, precioDescuento = null;
  if (enDescuento) {
    precioDescuento = parseInt($('precioDescuentoInput').value.replace(/\D/g, ''), 10);
    if (!precioDescuento || precioDescuento >= precio) {
      alert('El precio con descuento tiene que ser menor al precio normal.'); return;
    }
  }

  var btn = $('btnSubir');
  btn.disabled = true;
  var stamp = Date.now(), rutasGaleria = [], mapaMockups = {}, cadena = Promise.resolve();
  mostrarStatus('loading', 'Subiendo fotos de la galería...');

  galeria.forEach(function (img, idx) {
    cadena = cadena.then(function () {
      var path = 'images/' + slugify(nombre) + '-gal-' + stamp + '-' + idx + '.' + img.ext;
      return ghPutImage(path, img.base64, 'Galería ' + (idx + 1) + ': ' + nombre).then(function () {
        rutasGaleria.push(path);
      });
    });
  });
  mockups.forEach(function (mk, idx) {
    cadena = cadena.then(function () {
      mostrarStatus('loading', 'Subiendo mockup ' + (idx + 1) + ' de ' + mockups.length + '...');
      var path = 'images/' + slugify(nombre) + '-' + slugify(mk.color) + '-' + stamp + '-' + idx + '.' + mk.ext;
      return ghPutImage(path, mk.base64, 'Mockup ' + mk.color + ': ' + nombre).then(function () {
        if (!mapaMockups[mk.color]) mapaMockups[mk.color] = [];
        mapaMockups[mk.color].push(path);
      });
    });
  });

  cadena.then(function () {
    mostrarStatus('loading', 'Actualizando categorías...');
    return ghGet('data/categorias.json').then(function (r) {
      if (!r.content[categoria]) r.content[categoria] = [];
      if (subcategoria && r.content[categoria].indexOf(subcategoria) === -1) r.content[categoria].push(subcategoria);
      return ghPut('data/categorias.json', r.content, r.sha, 'Categorías: ' + categoria);
    });
  }).then(function () {
    mostrarStatus('loading', 'Guardando producto...');
    return ghGet('data/products.json').then(function (r) {
      r.content.push({
        id: stamp, nombre: nombre, categoria: categoria, subcategoria: subcategoria || null,
        imagenes: rutasGaleria, mockups: mapaMockups, colores: colores,
        precio: precio, enDescuento: enDescuento, precioDescuento: precioDescuento,
        impresion: $('impresionSelect').value,
        destacado: $('nuevoDestacado').checked,
        agotado: $('nuevoAgotado').checked,
        oculto: $('nuevoOculto').checked
      });
      return ghPut('data/products.json', r.content, r.sha, 'Nuevo producto: ' + nombre);
    });
  }).then(function () {
    mostrarStatus('ok', '✓ "' + nombre + '" subido. Tarda 1-2 min en verse en la tienda.');
    $('nombreProducto').value = '';
    $('precioInput').value = '19500';
    $('descuentoCheck').checked = false;
    $('precioDescuentoInput').value = '';
    $('rowDescuento').style.display = 'none';
    $('nuevoDestacado').checked = false;
    $('nuevoAgotado').checked = false;
    $('nuevoOculto').checked = false;
    galeria = []; mockups = [];
    renderGaleria(); renderMockups(); renderColorChecks();
    return cargarCategorias().then(cargarProductos);
  }).catch(function (e) {
    mostrarStatus('err', 'Error: ' + e.message);
  }).then(function () {
    btn.disabled = false;
  });
}

/* ---------- LISTA / EDICIÓN ---------- */
function cargarProductos() {
  statusEdit('loading', 'Cargando productos...');
  return ghGet('data/products.json').then(function (r) {
    PRODUCTOS = r.content;
    renderLista();
    $('statusEdit').className = 'status';
  }).catch(function (e) { statusEdit('err', e.message); });
}

function portadaDe(p) {
  if (p.imagenes && p.imagenes.length) return p.imagenes[0];
  if (p.mockups) {
    var claves = Object.keys(p.mockups);
    if (claves.length) {
      var primero = p.mockups[claves[0]];
      return (typeof primero === 'string') ? primero : primero[0];
    }
  }
  return '';
}

function renderLista(abrirIdx) {
  if (!PRODUCTOS.length) {
    $('listaProductos').innerHTML = '<div style="color:var(--mudo);font-size:13px;">Todavía no hay productos.</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < PRODUCTOS.length; i++) {
    var p = PRODUCTOS[i];
    var precio = p.precio || 19500;
    var meta = (p.enDescuento && p.precioDescuento)
      ? '<span class="tachado">' + plata(precio) + '</span><span class="vigente">' + plata(p.precioDescuento) + '</span>'
      : '<span class="vigente">' + plata(precio) + '</span>';
    if (p.destacado) meta += '<span class="chip dest">destacado</span>';
    if (p.agotado) meta += '<span class="chip ago">agotado</span>';
    if (p.oculto) meta += '<span class="chip">oculto</span>';

    html += '<div class="prod-row' + (p.oculto ? ' off' : '') + '">' +
      '<img class="prod-thumb" src="' + portadaDe(p) + '">' +
      '<div class="prod-info"><div class="prod-nombre">' + p.nombre + '</div>' +
      '<div class="prod-meta">' + meta + '</div></div>' +
      '<button class="prod-btn" data-accion="visible" data-i="' + i + '" title="Mostrar u ocultar">' + (p.oculto ? '○' : '●') + '</button>' +
      '<button class="prod-btn" data-accion="editar" data-i="' + i + '" title="Editar">✎</button>' +
      '<button class="prod-btn del" data-accion="borrar" data-i="' + i + '" title="Borrar">✕</button>' +
      '</div><div class="prod-edit" id="edit-' + i + '" style="display:none;"></div>';
  }
  $('listaProductos').innerHTML = html;
  if (typeof abrirIdx === 'number') abrirEdicion(abrirIdx);
}

function bloqueImagenes(i, tipo, color, rutas) {
  var html = '<div class="im-grid">';
  for (var k = 0; k < rutas.length; k++) {
    html += '<div class="im-item"><img src="' + rutas[k] + '">';
    if (tipo === 'gal' && k > 0) {
      html += '<button class="im-star" data-accion="portada" data-i="' + i + '" data-idx="' + k + '" title="Usar como portada">★</button>';
    }
    if (tipo === 'gal' && k === 0) html += '<span class="im-tag">portada</span>';
    html += '<button class="im-rm" data-accion="borrar-img" data-i="' + i + '" data-idx="' + k +
      '" data-tipo="' + tipo + '" data-color="' + (color || '') + '" title="Quitar">✕</button></div>';
  }
  html += '<label class="im-add">+<input type="file" accept="image/*" multiple data-subir="' + tipo +
    '" data-i="' + i + '" data-color="' + (color || '') + '"></label></div>';
  return html;
}

function abrirEdicion(i) {
  var caja = $('edit-' + i);
  if (!caja) return;
  if (caja.style.display === 'block') { caja.style.display = 'none'; return; }

  var p = PRODUCTOS[i];
  var precio = p.precio || 19500;
  var colores = p.colores || [];
  var cats = Object.keys(CATEGORIAS);

  var html = '<label>Nombre</label><input type="text" id="e-nombre-' + i + '" value="' + p.nombre + '">';

  html += '<label>Categoría</label><select id="e-cat-' + i + '">';
  for (var c = 0; c < cats.length; c++) {
    html += '<option value="' + cats[c] + '"' + (p.categoria === cats[c] ? ' selected' : '') + '>' + cats[c] + '</option>';
  }
  html += '</select>';

  html += '<label>Subcategoría</label><input type="text" id="e-sub-' + i + '" value="' + (p.subcategoria || '') + '" placeholder="dejá vacío para ninguna">';

  html += '<label>Colores disponibles</label><div class="color-check-grid">';
  for (var k = 0; k < COLORES.length; k++) {
    var marcado = colores.indexOf(COLORES[k].name) !== -1 ? ' checked' : '';
    var sombra = COLORES[k].name === 'Blanco' ? 'inset 0 0 0 1px #444' : 'none';
    html += '<label class="color-check"><input type="checkbox" class="e-color-' + i + '" value="' + COLORES[k].name + '"' + marcado + '>' +
      '<span class="swatch" style="background:' + COLORES[k].hex + ';box-shadow:' + sombra + ';"></span>' +
      '<span class="lbl">' + COLORES[k].name + '</span></label>';
  }
  html += '</div>';

  var imp = p.impresion || 'espalda';
  html += '<label>Tipo de impresión</label><select id="e-imp-' + i + '">';
  html += '<option value="espalda"' + (imp === 'espalda' ? ' selected' : '') + '>Espalda grande + pecho pequeño</option>';
  html += '<option value="pecho"' + (imp === 'pecho' ? ' selected' : '') + '>Solo pecho</option></select>';
  html += '<label>Precio</label><input type="text" id="e-precio-' + i + '" value="' + precio + '" inputmode="numeric">';
  html += '<label class="check-row"><input type="checkbox" id="e-desc-' + i + '"' + (p.enDescuento ? ' checked' : '') + '><span>Está en descuento</span></label>';
  html += '<label>Precio con descuento</label><input type="text" id="e-precdesc-' + i + '" value="' + (p.precioDescuento || '') + '" inputmode="numeric">';

  html += '<div class="banderas">' +
    '<label class="check-row"><input type="checkbox" id="e-dest-' + i + '"' + (p.destacado ? ' checked' : '') + '><span>Destacado</span></label>' +
    '<label class="check-row"><input type="checkbox" id="e-ago-' + i + '"' + (p.agotado ? ' checked' : '') + '><span>Agotado</span></label>' +
    '<label class="check-row"><input type="checkbox" id="e-ocu-' + i + '"' + (p.oculto ? ' checked' : '') + '><span>Oculto</span></label>' +
    '</div>';

  html += '<button class="btn" data-accion="guardar" data-i="' + i + '">Guardar cambios</button>';

  /* ---- imágenes ---- */
  html += '<div class="subtit">Fotos de galería</div>';
  html += bloqueImagenes(i, 'gal', '', p.imagenes || []);

  html += '<div class="subtit">Mockups por color</div>';
  for (var m = 0; m < COLORES.length; m++) {
    var nom = COLORES[m].name;
    var lista = (p.mockups && p.mockups[nom]) || [];
    if (typeof lista === 'string') lista = [lista];
    html += '<div class="mock-block"><div class="mock-head"><span class="sw" style="background:' + COLORES[m].hex + '"></span>' + nom +
      '<span style="margin-left:auto;font-size:11px;">' + lista.length + '</span></div>';
    html += bloqueImagenes(i, 'mock', nom, lista);
    html += '</div>';
  }
  html += '<p style="font-size:11px;color:var(--mudo);margin-top:12px;">Las fotos se suben y se borran al instante. Los cambios de texto y precio necesitan el botón de guardar.</p>';

  caja.innerHTML = html;
  caja.style.display = 'block';
}

function guardarEdicion(i) {
  var p = PRODUCTOS[i];
  var nombre = $('e-nombre-' + i).value.trim();
  if (!nombre) { alert('El nombre no puede quedar vacío.'); return; }

  var precio = parseInt($('e-precio-' + i).value.replace(/\D/g, ''), 10);
  if (!precio || precio <= 0) { alert('Poné un precio válido.'); return; }

  var enDescuento = $('e-desc-' + i).checked;
  var precioDescuento = parseInt($('e-precdesc-' + i).value.replace(/\D/g, ''), 10) || null;
  if (enDescuento && (!precioDescuento || precioDescuento >= precio)) {
    alert('El precio con descuento tiene que ser menor al precio normal.'); return;
  }

  var marcados = document.querySelectorAll('.e-color-' + i + ':checked'), colores = [];
  for (var m = 0; m < marcados.length; m++) colores.push(marcados[m].value);
  if (!colores.length) { alert('Marcá al menos un color.'); return; }

  p.nombre = nombre;
  p.categoria = $('e-cat-' + i).value;
  p.subcategoria = $('e-sub-' + i).value.trim() || null;
  p.colores = colores;
  p.impresion = $('e-imp-' + i).value;
  p.precio = precio;
  p.enDescuento = enDescuento;
  p.precioDescuento = enDescuento ? precioDescuento : null;
  p.destacado = $('e-dest-' + i).checked;
  p.agotado = $('e-ago-' + i).checked;
  p.oculto = $('e-ocu-' + i).checked;

  guardarProductos('Edita: ' + nombre);
}

function alternarVisible(i) {
  PRODUCTOS[i].oculto = !PRODUCTOS[i].oculto;
  guardarProductos((PRODUCTOS[i].oculto ? 'Oculta: ' : 'Muestra: ') + PRODUCTOS[i].nombre);
}

function borrarProducto(i) {
  var p = PRODUCTOS[i];
  if (!confirm('¿Borrar "' + p.nombre + '" del catálogo? Esto no se puede deshacer.')) return;
  PRODUCTOS.splice(i, 1);
  guardarProductos('Borra: ' + p.nombre);
}

function quitarTodosLosDescuentos() {
  if (!confirm('¿Quitar el descuento a los ' + PRODUCTOS.length + ' productos?')) return;
  for (var i = 0; i < PRODUCTOS.length; i++) {
    PRODUCTOS[i].enDescuento = false;
    PRODUCTOS[i].precioDescuento = null;
  }
  guardarProductos('Quita todos los descuentos');
}

function guardarProductos(mensaje, reabrir) {
  statusEdit('loading', 'Guardando...');
  return ghGet('data/products.json').then(function (r) {
    return ghPut('data/products.json', PRODUCTOS, r.sha, mensaje);
  }).then(function () {
    statusEdit('ok', '✓ Guardado. Tarda 1-2 min en verse en la tienda.');
    renderLista(reabrir);
  }).catch(function (e) { statusEdit('err', e.message); });
}

/* ---------- IMÁGENES DE UN PRODUCTO YA SUBIDO ---------- */
function borrarImagen(i, tipo, color, idx) {
  var p = PRODUCTOS[i], ruta;
  if (tipo === 'gal') {
    ruta = p.imagenes[idx];
    p.imagenes.splice(idx, 1);
  } else {
    var lista = p.mockups[color];
    if (typeof lista === 'string') lista = [lista];
    ruta = lista[idx];
    lista.splice(idx, 1);
    if (lista.length) p.mockups[color] = lista;
    else delete p.mockups[color];
  }
  ghBorrarArchivo(ruta, 'Quita foto: ' + p.nombre);
  guardarProductos('Quita foto de ' + p.nombre, i);
}

function hacerPortada(i, idx) {
  var p = PRODUCTOS[i];
  var foto = p.imagenes.splice(idx, 1)[0];
  p.imagenes.unshift(foto);
  guardarProductos('Cambia portada: ' + p.nombre, i);
}

function subirImagenesA(i, tipo, color, fileList) {
  if (!fileList.length) return;
  var p = PRODUCTOS[i];
  statusEdit('loading', 'Optimizando ' + fileList.length + ' imagen(es)...');
  comprimirVarias(fileList).then(function (items) {
    var stamp = Date.now(), rutas = [], cadena = Promise.resolve();
    items.forEach(function (img, n) {
      cadena = cadena.then(function () {
        statusEdit('loading', 'Subiendo ' + (n + 1) + ' de ' + items.length + '...');
        var trozo = tipo === 'gal' ? 'gal' : slugify(color);
        var path = 'images/' + slugify(p.nombre) + '-' + trozo + '-' + stamp + '-' + n + '.' + img.ext;
        return ghPutImage(path, img.base64, 'Nueva foto: ' + p.nombre).then(function () { rutas.push(path); });
      });
    });
    return cadena.then(function () {
      if (tipo === 'gal') {
        if (!p.imagenes) p.imagenes = [];
        p.imagenes = p.imagenes.concat(rutas);
      } else {
        if (!p.mockups) p.mockups = {};
        var lista = p.mockups[color];
        if (typeof lista === 'string') lista = [lista];
        p.mockups[color] = (lista || []).concat(rutas);
        if (!p.colores) p.colores = [];
        if (p.colores.indexOf(color) === -1) p.colores.push(color);
      }
      return guardarProductos('Agrega fotos a ' + p.nombre, i);
    });
  }).catch(function (e) { statusEdit('err', 'Error: ' + e.message); });
}

/* ---------- EVENTOS ---------- */
$('btnGuardarConfig').addEventListener('click', guardarConfig);
$('btnBorrarConfig').addEventListener('click', borrarConfig);
$('btnNuevaCat').addEventListener('click', crearCategoria);
$('btnNuevaSubcat').addEventListener('click', crearSubcategoria);
$('btnSubir').addEventListener('click', subirProducto);
$('btnRecargar').addEventListener('click', cargarProductos);
$('btnQuitarDesc').addEventListener('click', quitarTodosLosDescuentos);

$('dropGaleria').addEventListener('click', function () { $('inputGaleria').click(); });
$('dropMockups').addEventListener('click', function () { $('inputMockups').click(); });

$('inputGaleria').addEventListener('change', function (e) {
  leerArchivos(e.target.files, galeria, renderGaleria);
  e.target.value = '';
});
$('inputMockups').addEventListener('change', function (e) {
  leerArchivos(e.target.files, mockups, renderMockups);
  e.target.value = '';
});

$('categoriaSelect').addEventListener('change', function () {
  $('rowNuevaCat').style.display = this.value === '__nueva__' ? 'flex' : 'none';
  renderSubcategorias();
});
$('subcategoriaSelect').addEventListener('change', function () {
  $('rowNuevaSubcat').style.display = this.value === '__nueva__' ? 'flex' : 'none';
});
$('descuentoCheck').addEventListener('change', function () {
  $('rowDescuento').style.display = this.checked ? 'block' : 'none';
});
$('impresionSelect').addEventListener('change', function () {
  $('precioInput').value = this.value === 'pecho' ? '14500' : '19500';
});

$('gridGaleria').addEventListener('click', function (e) {
  if (e.target.classList.contains('rm')) {
    galeria.splice(parseInt(e.target.getAttribute('data-i'), 10), 1);
    renderGaleria();
  }
});
$('gridMockups').addEventListener('click', function (e) {
  if (e.target.classList.contains('rm')) {
    mockups.splice(parseInt(e.target.getAttribute('data-i'), 10), 1);
    renderMockups();
  }
});
$('gridMockups').addEventListener('change', function (e) {
  if (e.target.classList.contains('mockup-color')) {
    mockups[parseInt(e.target.getAttribute('data-i'), 10)].color = e.target.value || null;
  }
});

$('listaProductos').addEventListener('click', function (e) {
  var btn = e.target.closest('[data-accion]');
  if (!btn) return;
  var i = parseInt(btn.getAttribute('data-i'), 10);
  var accion = btn.getAttribute('data-accion');
  if (accion === 'editar') abrirEdicion(i);
  else if (accion === 'borrar') borrarProducto(i);
  else if (accion === 'guardar') guardarEdicion(i);
  else if (accion === 'visible') alternarVisible(i);
  else if (accion === 'portada') hacerPortada(i, parseInt(btn.getAttribute('data-idx'), 10));
  else if (accion === 'borrar-img') {
    if (!confirm('¿Quitar esta foto?')) return;
    borrarImagen(i, btn.getAttribute('data-tipo'), btn.getAttribute('data-color'), parseInt(btn.getAttribute('data-idx'), 10));
  }
});

$('listaProductos').addEventListener('change', function (e) {
  var inp = e.target.closest('[data-subir]');
  if (!inp) return;
  subirImagenesA(
    parseInt(inp.getAttribute('data-i'), 10),
    inp.getAttribute('data-subir'),
    inp.getAttribute('data-color'),
    inp.files
  );
  inp.value = '';
});

mostrarEstadoConfig();
</script>
