<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuzu — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e0e0e; --surface: #161616; --surface2: #1f1f1f; --border: #2a2a2a;
    --text: #f0f0f0; --muted: #888; --accent: #c8f135; --accent-dark: #9db82a;
    --radius: 10px; --font: 'Space Grotesk', sans-serif; --mono: 'Space Mono', monospace;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; padding: 24px 16px; }
  .wrap { max-width: 480px; margin: 0 auto; }
  .logo { font-family: var(--mono); font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 14px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }

  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; margin-top: 16px; }
  input[type="text"], input[type="password"], select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 12px; font-family: var(--font); font-size: 14px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select { cursor: pointer; }

  .file-drop {
    border: 2px dashed var(--border); border-radius: 10px; padding: 20px; text-align: center;
    cursor: pointer; transition: border-color 0.15s; color: var(--muted); font-size: 13px;
  }
  .file-drop:hover { border-color: var(--accent); }
  .hidden-input { display: none; }

  .preview-grid { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .preview-item { position: relative; width: 92px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--surface2); }
  .preview-item .thumb { width: 100%; height: 76px; object-fit: cover; display: block; }
  .preview-item .rm {
    position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,0.75); color: #fff;
    border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; line-height: 1;
  }
  .preview-item .tag { display: block; font-size: 9px; text-align: center; padding: 3px 0; color: var(--accent); font-family: var(--mono); }
  .preview-item select { padding: 3px; font-size: 10px; border-radius: 0; border: none; border-top: 1px solid var(--border); }

  .btn {
    width: 100%; background: var(--accent); color: #0e0e0e; border: none; border-radius: var(--radius);
    padding: 14px; font-family: var(--font); font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background 0.15s; margin-top: 20px;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  .status { font-size: 13px; margin-top: 12px; padding: 10px 12px; border-radius: 8px; display: none; }
  .status.show { display: block; }
  .status.ok { background: rgba(200,241,53,0.1); color: var(--accent); border: 1px solid var(--accent); }
  .status.err { background: rgba(255,85,85,0.1); color: #ff5555; border: 1px solid #ff5555; }
  .status.loading { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row input { flex: 1; }
  .row button { flex-shrink: 0; width: auto; margin: 0; padding: 12px 16px; }

  .token-ok { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--accent); }
  .token-ok button { background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; margin-left: auto; }

  .color-check-grid { display: flex; gap: 10px; flex-wrap: wrap; }
  .color-check { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 52px; }
  .color-check input { width: auto; margin: 0; }
  .color-check .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); }
  .color-check .lbl { font-size: 9px; color: var(--muted); text-align: center; line-height: 1.2; }

  .check-row { display: flex; align-items: center; gap: 8px; margin-top: 18px; cursor: pointer; }
  .check-row input { width: auto; }
  .check-row span { font-size: 13px; color: var(--text); }

  .prod-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .prod-thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
  .prod-info { flex: 1; min-width: 0; }
  .prod-nombre { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prod-meta { font-size: 11px; color: var(--muted); }
  .prod-meta .tachado { text-decoration: line-through; margin-right: 5px; }
  .prod-meta .vigente { color: var(--accent); }
  .prod-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 6px; width: 32px; height: 32px; cursor: pointer; font-size: 14px; flex-shrink: 0;
  }
  .prod-btn:hover { border-color: var(--accent); color: var(--text); }
  .prod-btn.del:hover { border-color: #ff5555; color: #ff5555; }
  .prod-edit { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 8px 0 14px; }
  .prod-edit label { margin-top: 12px; }
  .prod-edit label:first-child { margin-top: 0; }
  .prod-edit .btn { margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">YUZU · ADMIN</div>
  <div class="subtitle">Subir productos al catálogo</div>

  <div class="card" id="setupCard">
    <h2>Configuración (una sola vez)</h2>
    <label>Tu usuario de GitHub</label>
    <input type="text" id="repoOwner" placeholder="ej: YuzuCR">
    <label>Nombre del repositorio</label>
    <input type="text" id="repoName" placeholder="ej: Yuzu-Catalogo">
    <label>Token de acceso de GitHub</label>
    <input type="password" id="ghToken" placeholder="github_pat_xxxxx">
    <button class="btn" id="btnGuardarConfig">Guardar configuración</button>
  </div>

  <div class="card" id="configOk" style="display:none;">
    <div class="token-ok">
      ✓ Configuración guardada en este navegador
      <button id="btnBorrarConfig">cambiar</button>
    </div>
  </div>

  <div class="card" id="formCard" style="display:none;">
    <h2>Nuevo producto</h2>

    <label>Fotos del diseño — galería (espalda, frente, lateral, modelo)</label>
    <div class="file-drop" id="dropGaleria">Tocá para elegir fotos</div>
    <input type="file" id="inputGaleria" class="hidden-input" accept="image/*" multiple>
    <div class="preview-grid" id="gridGaleria"></div>

    <label>Mockups por color (uno por color — poné el color en el nombre del archivo)</label>
    <div class="file-drop" id="dropMockups">Tocá para elegir mockups</div>
    <input type="file" id="inputMockups" class="hidden-input" accept="image/*" multiple>
    <div class="preview-grid" id="gridMockups"></div>

    <label>Nombre del diseño</label>
    <input type="text" id="nombreProducto" placeholder="ej: Eren Yeager">

    <label>Categoría</label>
    <select id="categoriaSelect"></select>
    <div class="row" id="rowNuevaCat" style="display:none;">
      <input type="text" id="inputNuevaCat" placeholder="Nombre de la nueva categoría">
      <button class="btn btn-secondary" id="btnNuevaCat">Crear</button>
    </div>

    <label>Subcategoría (la serie) — opcional</label>
    <select id="subcategoriaSelect"></select>
    <div class="row" id="rowNuevaSubcat" style="display:none;">
      <input type="text" id="inputNuevaSubcat" placeholder="ej: Attack on Titan">
      <button class="btn btn-secondary" id="btnNuevaSubcat">Crear</button>
    </div>

    <label>Colores disponibles</label>
    <div class="color-check-grid" id="colorCheckGrid"></div>

    <label>Precio</label>
    <input type="text" id="precioInput" value="19500" inputmode="numeric">

    <label class="check-row">
      <input type="checkbox" id="descuentoCheck">
      <span>Está en descuento</span>
    </label>
    <div id="rowDescuento" style="display:none;">
      <label>Precio con descuento</label>
      <input type="text" id="precioDescuentoInput" inputmode="numeric" placeholder="ej: 15500">
    </div>

    <button class="btn" id="btnSubir">Subir producto</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card" id="editCard" style="display:none;">
    <h2>Editar productos</h2>
    <div class="row" style="margin-top:0;">
      <button class="btn btn-secondary" id="btnRecargar" style="margin-top:0;">Recargar lista</button>
      <button class="btn btn-secondary" id="btnQuitarDesc" style="margin-top:0;">Quitar todos los descuentos</button>
    </div>
    <div id="listaProductos" style="margin-top:16px;"></div>
    <div class="status" id="statusEdit"></div>
  </div>
</div>

<script>
var COLORES = [
  { name: 'Blanco', hex: '#ffffff' },
  { name: 'Negro', hex: '#1a1a1a' },
  { name: 'Crema', hex: '#f0e6d2' },
  { name: 'Café', hex: '#6b4a35' },
  { name: 'Gris grafito', hex: '#4a4a4a' },
  { name: 'Azul marino', hex: '#1b3a5c' },
  { name: 'Verde musgo', hex: '#4a6741' }
];

var CATEGORIAS = {};
var galeria = [];
var mockups = [];

function $(id) { return document.getElementById(id); }

function normalizar(str) {
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
}

function detectarColor(nombreArchivo) {
  var n = normalizar(nombreArchivo);
  for (var i = 0; i < COLORES.length; i++) {
    if (n.indexOf(normalizar(COLORES[i].name)) !== -1) return COLORES[i].name;
  }
  return null;
}

function slugify(str) {
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function mostrarStatus(tipo, msg) {
  var el = $('status');
  el.className = 'status show ' + tipo;
  el.textContent = msg;
}

/* ---------- CONFIG ---------- */

function guardarConfig() {
  var owner = $('repoOwner').value.trim();
  var repo = $('repoName').value.trim();
  var token = $('ghToken').value.trim();
  if (!owner || !repo || !token) { alert('Completá los 3 campos.'); return; }
  localStorage.setItem('yuzu_owner', owner);
  localStorage.setItem('yuzu_repo', repo);
  localStorage.setItem('yuzu_token', token);
  mostrarEstadoConfig();
}

function borrarConfig() {
  localStorage.removeItem('yuzu_owner');
  localStorage.removeItem('yuzu_repo');
  localStorage.removeItem('yuzu_token');
  mostrarEstadoConfig();
}

function getConfig() {
  return {
    owner: localStorage.getItem('yuzu_owner'),
    repo: localStorage.getItem('yuzu_repo'),
    token: localStorage.getItem('yuzu_token')
  };
}

function mostrarEstadoConfig() {
  var cfg = getConfig();
  if (cfg.owner && cfg.repo && cfg.token) {
    $('setupCard').style.display = 'none';
    $('configOk').style.display = 'block';
    $('formCard').style.display = 'block';
    $('editCard').style.display = 'block';
    renderColorChecks();
    cargarCategorias().then(cargarProductos);
  } else {
    $('setupCard').style.display = 'block';
    $('configOk').style.display = 'none';
    $('formCard').style.display = 'none';
    $('editCard').style.display = 'none';
  }
}

/* ---------- GITHUB API ---------- */

function errorDeRespuesta(res, contexto) {
  return res.json().catch(function () { return {}; }).then(function (err) {
    var detalle = err.message || '';
    if (err.errors && err.errors.length && err.errors[0].message) {
      detalle += ' — ' + err.errors[0].message;
    }
    throw new Error(contexto + ' (' + res.status + ') ' + detalle);
  });
}

function ghGet(path) {
  var cfg = getConfig();
  return fetch('https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + path, {
    headers: { Authorization: 'token ' + cfg.token }
  }).then(function (res) {
    if (!res.ok) return errorDeRespuesta(res, 'No pude leer ' + path);
    return res.json();
  }).then(function (data) {
    var texto = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
    return { content: JSON.parse(texto), sha: data.sha };
  });
}

function ghPut(path, obj, sha, message) {
  var cfg = getConfig();
  var encoded = btoa(unescape(encodeURIComponent(JSON.stringify(obj, null, 2))));
  var body = { message: message, content: encoded };
  if (sha) body.sha = sha;
  return fetch('https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + path, {
    method: 'PUT',
    headers: { Authorization: 'token ' + cfg.token, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function (res) {
    if (!res.ok) return errorDeRespuesta(res, 'Error guardando ' + path);
    return res.json();
  });
}

function ghPutImage(path, base64, message) {
  var cfg = getConfig();
  return fetch('https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + path, {
    method: 'PUT',
    headers: { Authorization: 'token ' + cfg.token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: message, content: base64 })
  }).then(function (res) {
    if (!res.ok) return errorDeRespuesta(res, 'Error subiendo ' + path);
    return res.json();
  });
}

/* ---------- CATEGORIAS ---------- */

function cargarCategorias() {
  return ghGet('data/categorias.json').then(function (r) {
    CATEGORIAS = r.content;
    renderCategorias();
  }).catch(function (e) {
    mostrarStatus('err', 'No pude cargar las categorías: ' + e.message);
  });
}

function renderCategorias() {
  var sel = $('categoriaSelect');
  var html = '';
  var cats = Object.keys(CATEGORIAS);
  for (var i = 0; i < cats.length; i++) {
    html += '<option value="' + cats[i] + '">' + cats[i] + '</option>';
  }
  html += '<option value="__nueva__">+ Crear nueva categoría</option>';
  sel.innerHTML = html;
  renderSubcategorias();
}

function renderSubcategorias() {
  var cat = $('categoriaSelect').value;
  var sel = $('subcategoriaSelect');
  if (cat === '__nueva__' || !CATEGORIAS[cat]) {
    sel.innerHTML = '<option value="">— ninguna —</option>';
    $('rowNuevaSubcat').style.display = 'none';
    return;
  }
  var subs = CATEGORIAS[cat] || [];
  var html = '<option value="">— ninguna —</option>';
  for (var i = 0; i < subs.length; i++) {
    html += '<option value="' + subs[i] + '">' + subs[i] + '</option>';
  }
  html += '<option value="__nueva__">+ Crear nueva subcategoría</option>';
  sel.innerHTML = html;
}

function crearCategoria() {
  var nueva = $('inputNuevaCat').value.trim();
  if (!nueva) return;
  if (!CATEGORIAS[nueva]) CATEGORIAS[nueva] = [];
  renderCategorias();
  $('categoriaSelect').value = nueva;
  $('rowNuevaCat').style.display = 'none';
  $('inputNuevaCat').value = '';
  renderSubcategorias();
}

function crearSubcategoria() {
  var nueva = $('inputNuevaSubcat').value.trim();
  if (!nueva) return;
  var cat = $('categoriaSelect').value;
  if (!CATEGORIAS[cat]) CATEGORIAS[cat] = [];
  if (CATEGORIAS[cat].indexOf(nueva) === -1) CATEGORIAS[cat].push(nueva);
  renderSubcategorias();
  $('subcategoriaSelect').value = nueva;
  $('rowNuevaSubcat').style.display = 'none';
  $('inputNuevaSubcat').value = '';
}

/* ---------- COLORES ---------- */

function renderColorChecks() {
  var html = '';
  for (var i = 0; i < COLORES.length; i++) {
    var c = COLORES[i];
    var sombra = c.name === 'Blanco' ? 'inset 0 0 0 1px #444' : 'none';
    html += '<label class="color-check">';
    html += '<input type="checkbox" value="' + c.name + '" checked>';
    html += '<span class="swatch" style="background:' + c.hex + '; box-shadow:' + sombra + ';"></span>';
    html += '<span class="lbl">' + c.name + '</span>';
    html += '</label>';
  }
  $('colorCheckGrid').innerHTML = html;
}

function coloresMarcados() {
  var inputs = document.querySelectorAll('#colorCheckGrid input:checked');
  var out = [];
  for (var i = 0; i < inputs.length; i++) out.push(inputs[i].value);
  return out;
}

/* ---------- ARCHIVOS ---------- */

var MAX_LADO = 1400;
var CALIDAD = 0.88;

function comprimirImagen(file, callback) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var w = img.width;
      var h = img.height;
      if (w > MAX_LADO || h > MAX_LADO) {
        if (w >= h) {
          h = Math.round(h * MAX_LADO / w);
          w = MAX_LADO;
        } else {
          w = Math.round(w * MAX_LADO / h);
          h = MAX_LADO;
        }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      var dataUrl = canvas.toDataURL('image/jpeg', CALIDAD);
      var base64 = dataUrl.split(',')[1];
      callback({
        base64: base64,
        ext: 'jpg',
        preview: dataUrl,
        nombre: file.name,
        color: detectarColor(file.name),
        peso: Math.round(base64.length * 0.75 / 1024)
      });
    };
    img.onerror = function () { callback(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { callback(null); };
  reader.readAsDataURL(file);
}

function leerArchivos(fileList, destino, callback) {
  var files = Array.prototype.slice.call(fileList);
  var pendientes = files.length;
  if (pendientes === 0) return;
  mostrarStatus('loading', 'Optimizando ' + pendientes + ' imagen(es)...');
  files.forEach(function (file) {
    comprimirImagen(file, function (item) {
      if (item) destino.push(item);
      pendientes--;
      if (pendientes === 0) {
        callback();
        $('status').className = 'status';
      }
    });
  });
}

function renderGaleria() {
  var html = '';
  for (var i = 0; i < galeria.length; i++) {
    html += '<div class="preview-item">';
    html += '<img class="thumb" src="' + galeria[i].preview + '">';
    html += '<button class="rm" data-tipo="galeria" data-i="' + i + '">✕</button>';
    html += '<span class="tag">' + (i === 0 ? 'principal' : 'foto ' + (i + 1)) + ' · ' + galeria[i].peso + 'kb</span>';
    html += '</div>';
  }
  $('gridGaleria').innerHTML = html;
}

function renderMockups() {
  var html = '';
  for (var i = 0; i < mockups.length; i++) {
    var m = mockups[i];
    html += '<div class="preview-item">';
    html += '<img class="thumb" src="' + m.preview + '">';
    html += '<button class="rm" data-tipo="mockup" data-i="' + i + '">✕</button>';
    html += '<select data-i="' + i + '" class="mockup-color">';
    html += '<option value="">— sin color —</option>';
    for (var j = 0; j < COLORES.length; j++) {
      var sel = m.color === COLORES[j].name ? ' selected' : '';
      html += '<option value="' + COLORES[j].name + '"' + sel + '>' + COLORES[j].name + '</option>';
    }
    html += '</select>';
    html += '</div>';
  }
  $('gridMockups').innerHTML = html;
}

/* ---------- SUBIR ---------- */

function subirProducto() {
  var nombre = $('nombreProducto').value.trim();
  var categoria = $('categoriaSelect').value;
  var subcategoria = $('subcategoriaSelect').value;

  if (!nombre) { alert('Ponele nombre al diseño.'); return; }
  if (!categoria || categoria === '__nueva__') { alert('Elegí o creá una categoría.'); return; }
  if (subcategoria === '__nueva__') { alert('Confirmá la subcategoría nueva o elegí — ninguna —.'); return; }
  if (galeria.length === 0 && mockups.length === 0) { alert('Subí al menos una foto (galería o mockups).'); return; }

  var colores = coloresMarcados();
  if (colores.length === 0) { alert('Marcá al menos un color disponible.'); return; }

  for (var i = 0; i < mockups.length; i++) {
    if (!mockups[i].color) { alert('El mockup ' + (i + 1) + ' no tiene color asignado.'); return; }
  }

  var precio = parseInt($('precioInput').value.replace(/\D/g, ''), 10);
  if (!precio || precio <= 0) { alert('Poné un precio válido.'); return; }

  var enDescuento = $('descuentoCheck').checked;
  var precioDescuento = null;
  if (enDescuento) {
    precioDescuento = parseInt($('precioDescuentoInput').value.replace(/\D/g, ''), 10);
    if (!precioDescuento || precioDescuento >= precio) {
      alert('El precio con descuento tiene que ser menor al precio normal.');
      return;
    }
  }

  var btn = $('btnSubir');
  btn.disabled = true;

  var stamp = Date.now();
  var rutasGaleria = [];
  var mapaMockups = {};
  var cadena = Promise.resolve();

  mostrarStatus('loading', 'Subiendo fotos de la galería...');

  galeria.forEach(function (img, idx) {
    cadena = cadena.then(function () {
      var path = 'images/' + slugify(nombre) + '-gal-' + stamp + '-' + idx + '.' + img.ext;
      return ghPutImage(path, img.base64, 'Galería ' + (idx + 1) + ': ' + nombre).then(function () {
        rutasGaleria.push(path);
      });
    });
  });

  mockups.forEach(function (mk, idx) {
    cadena = cadena.then(function () {
      mostrarStatus('loading', 'Subiendo mockup ' + (idx + 1) + ' de ' + mockups.length + '...');
      var path = 'images/' + slugify(nombre) + '-' + slugify(mk.color) + '-' + stamp + '-' + idx + '.' + mk.ext;
      return ghPutImage(path, mk.base64, 'Mockup ' + mk.color + ': ' + nombre).then(function () {
        if (!mapaMockups[mk.color]) mapaMockups[mk.color] = [];
        mapaMockups[mk.color].push(path);
      });
    });
  });

  cadena.then(function () {
    mostrarStatus('loading', 'Actualizando categorías...');
    return ghGet('data/categorias.json').then(function (r) {
      if (!r.content[categoria]) r.content[categoria] = [];
      if (subcategoria && r.content[categoria].indexOf(subcategoria) === -1) {
        r.content[categoria].push(subcategoria);
      }
      return ghPut('data/categorias.json', r.content, r.sha, 'Categorías: ' + categoria);
    });
  }).then(function () {
    mostrarStatus('loading', 'Guardando producto...');
    return ghGet('data/products.json').then(function (r) {
      r.content.push({
        id: stamp,
        nombre: nombre,
        categoria: categoria,
        subcategoria: subcategoria || null,
        imagenes: rutasGaleria,
        mockups: mapaMockups,
        colores: colores,
        precio: precio,
        enDescuento: enDescuento,
        precioDescuento: precioDescuento
      });
      return ghPut('data/products.json', r.content, r.sha, 'Nuevo producto: ' + nombre);
    });
  }).then(function () {
    mostrarStatus('ok', '✓ "' + nombre + '" subido. Puede tardar 1-2 min en verse en la tienda.');
    $('nombreProducto').value = '';
    $('precioInput').value = '19500';
    $('descuentoCheck').checked = false;
    $('precioDescuentoInput').value = '';
    $('rowDescuento').style.display = 'none';
    galeria = [];
    mockups = [];
    renderGaleria();
    renderMockups();
    renderColorChecks();
    return cargarCategorias().then(cargarProductos);
  }).catch(function (e) {
    mostrarStatus('err', 'Error: ' + e.message);
  }).then(function () {
    btn.disabled = false;
  });
}

/* ---------- EDITAR PRODUCTOS ---------- */

var PRODUCTOS = [];

function statusEdit(tipo, msg) {
  var el = $('statusEdit');
  el.className = 'status show ' + tipo;
  el.textContent = msg;
}

function cargarProductos() {
  statusEdit('loading', 'Cargando productos...');
  return ghGet('data/products.json').then(function (r) {
    PRODUCTOS = r.content;
    renderLista();
    $('statusEdit').className = 'status';
  }).catch(function (e) {
    statusEdit('err', e.message);
  });
}

function portadaDe(p) {
  if (p.imagenes && p.imagenes.length) return p.imagenes[0];
  if (p.mockups) {
    var claves = Object.keys(p.mockups);
    if (claves.length) {
      var primero = p.mockups[claves[0]];
      return (typeof primero === 'string') ? primero : primero[0];
    }
  }
  return '';
}

function plata(n) {
  return '₡' + Number(n).toLocaleString('es-CR');
}

function renderLista() {
  if (!PRODUCTOS.length) {
    $('listaProductos').innerHTML = '<div style="color:var(--muted);font-size:13px;">No hay productos todavía.</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < PRODUCTOS.length; i++) {
    var p = PRODUCTOS[i];
    var precio = p.precio || 19500;
    var meta;
    if (p.enDescuento && p.precioDescuento) {
      meta = '<span class="tachado">' + plata(precio) + '</span><span class="vigente">' + plata(p.precioDescuento) + '</span>';
    } else {
      meta = '<span class="vigente">' + plata(precio) + '</span>';
    }
    html += '<div class="prod-row">';
    html += '<img class="prod-thumb" src="' + portadaDe(p) + '">';
    html += '<div class="prod-info"><div class="prod-nombre">' + p.nombre + '</div>';
    html += '<div class="prod-meta">' + meta + '</div></div>';
    html += '<button class="prod-btn" data-accion="editar" data-i="' + i + '">✎</button>';
    html += '<button class="prod-btn del" data-accion="borrar" data-i="' + i + '">✕</button>';
    html += '</div>';
    html += '<div class="prod-edit" id="edit-' + i + '" style="display:none;"></div>';
  }
  $('listaProductos').innerHTML = html;
}

function abrirEdicion(i) {
  var caja = $('edit-' + i);
  if (caja.style.display === 'block') { caja.style.display = 'none'; return; }

  var p = PRODUCTOS[i];
  var precio = p.precio || 19500;
  var colores = p.colores || [];
  var cats = Object.keys(CATEGORIAS);

  var html = '<label>Nombre</label>';
  html += '<input type="text" id="e-nombre-' + i + '" value="' + p.nombre + '">';

  html += '<label>Categoría</label><select id="e-cat-' + i + '">';
  for (var c = 0; c < cats.length; c++) {
    html += '<option value="' + cats[c] + '"' + (p.categoria === cats[c] ? ' selected' : '') + '>' + cats[c] + '</option>';
  }
  html += '</select>';

  html += '<label>Subcategoría</label>';
  html += '<input type="text" id="e-sub-' + i + '" value="' + (p.subcategoria || '') + '" placeholder="dejá vacío para ninguna">';

  html += '<label>Colores disponibles</label><div class="color-check-grid">';
  for (var k = 0; k < COLORES.length; k++) {
    var marcado = colores.indexOf(COLORES[k].name) !== -1 ? ' checked' : '';
    var sombra = COLORES[k].name === 'Blanco' ? 'inset 0 0 0 1px #444' : 'none';
    html += '<label class="color-check">';
    html += '<input type="checkbox" class="e-color-' + i + '" value="' + COLORES[k].name + '"' + marcado + '>';
    html += '<span class="swatch" style="background:' + COLORES[k].hex + ';box-shadow:' + sombra + ';"></span>';
    html += '<span class="lbl">' + COLORES[k].name + '</span></label>';
  }
  html += '</div>';

  html += '<label>Precio</label>';
  html += '<input type="text" id="e-precio-' + i + '" value="' + precio + '" inputmode="numeric">';

  html += '<label class="check-row"><input type="checkbox" id="e-desc-' + i + '"' + (p.enDescuento ? ' checked' : '') + '>';
  html += '<span>Está en descuento</span></label>';
  html += '<label>Precio con descuento</label>';
  html += '<input type="text" id="e-precdesc-' + i + '" value="' + (p.precioDescuento || '') + '" inputmode="numeric">';

  html += '<button class="btn" data-accion="guardar" data-i="' + i + '">Guardar cambios</button>';

  caja.innerHTML = html;
  caja.style.display = 'block';
}

function guardarEdicion(i) {
  var p = PRODUCTOS[i];
  var nombre = $('e-nombre-' + i).value.trim();
  if (!nombre) { alert('El nombre no puede quedar vacío.'); return; }

  var precio = parseInt($('e-precio-' + i).value.replace(/\D/g, ''), 10);
  if (!precio || precio <= 0) { alert('Poné un precio válido.'); return; }

  var enDescuento = $('e-desc-' + i).checked;
  var precioDescuento = parseInt($('e-precdesc-' + i).value.replace(/\D/g, ''), 10) || null;
  if (enDescuento && (!precioDescuento || precioDescuento >= precio)) {
    alert('El precio con descuento tiene que ser menor al precio normal.');
    return;
  }

  var marcados = document.querySelectorAll('.e-color-' + i + ':checked');
  var colores = [];
  for (var m = 0; m < marcados.length; m++) colores.push(marcados[m].value);
  if (!colores.length) { alert('Marcá al menos un color.'); return; }

  p.nombre = nombre;
  p.categoria = $('e-cat-' + i).value;
  p.subcategoria = $('e-sub-' + i).value.trim() || null;
  p.colores = colores;
  p.precio = precio;
  p.enDescuento = enDescuento;
  p.precioDescuento = enDescuento ? precioDescuento : null;

  guardarProductos('Edita: ' + nombre);
}

function borrarProducto(i) {
  var p = PRODUCTOS[i];
  if (!confirm('¿Borrar "' + p.nombre + '" del catálogo?')) return;
  PRODUCTOS.splice(i, 1);
  guardarProductos('Borra: ' + p.nombre);
}

function quitarTodosLosDescuentos() {
  if (!confirm('¿Quitar el descuento a los ' + PRODUCTOS.length + ' productos?')) return;
  for (var i = 0; i < PRODUCTOS.length; i++) {
    PRODUCTOS[i].enDescuento = false;
    PRODUCTOS[i].precioDescuento = null;
  }
  guardarProductos('Quita todos los descuentos');
}

function guardarProductos(mensaje) {
  statusEdit('loading', 'Guardando...');
  ghGet('data/products.json').then(function (r) {
    return ghPut('data/products.json', PRODUCTOS, r.sha, mensaje);
  }).then(function () {
    statusEdit('ok', '✓ Guardado. Puede tardar 1-2 min en verse en la tienda.');
    renderLista();
  }).catch(function (e) {
    statusEdit('err', e.message);
  });
}

/* ---------- EVENTOS ---------- */

$('btnGuardarConfig').addEventListener('click', guardarConfig);
$('btnBorrarConfig').addEventListener('click', borrarConfig);
$('btnNuevaCat').addEventListener('click', crearCategoria);
$('btnNuevaSubcat').addEventListener('click', crearSubcategoria);
$('btnSubir').addEventListener('click', subirProducto);

$('dropGaleria').addEventListener('click', function () { $('inputGaleria').click(); });
$('dropMockups').addEventListener('click', function () { $('inputMockups').click(); });

$('inputGaleria').addEventListener('change', function (e) {
  leerArchivos(e.target.files, galeria, renderGaleria);
  e.target.value = '';
});

$('inputMockups').addEventListener('change', function (e) {
  leerArchivos(e.target.files, mockups, renderMockups);
  e.target.value = '';
});

$('categoriaSelect').addEventListener('change', function () {
  $('rowNuevaCat').style.display = this.value === '__nueva__' ? 'flex' : 'none';
  renderSubcategorias();
});

$('subcategoriaSelect').addEventListener('change', function () {
  $('rowNuevaSubcat').style.display = this.value === '__nueva__' ? 'flex' : 'none';
});

$('descuentoCheck').addEventListener('change', function () {
  $('rowDescuento').style.display = this.checked ? 'block' : 'none';
});

$('gridGaleria').addEventListener('click', function (e) {
  if (e.target.classList.contains('rm')) {
    galeria.splice(parseInt(e.target.getAttribute('data-i'), 10), 1);
    renderGaleria();
  }
});

$('gridMockups').addEventListener('click', function (e) {
  if (e.target.classList.contains('rm')) {
    mockups.splice(parseInt(e.target.getAttribute('data-i'), 10), 1);
    renderMockups();
  }
});

$('gridMockups').addEventListener('change', function (e) {
  if (e.target.classList.contains('mockup-color')) {
    mockups[parseInt(e.target.getAttribute('data-i'), 10)].color = e.target.value || null;
  }
});

$('btnRecargar').addEventListener('click', cargarProductos);
$('btnQuitarDesc').addEventListener('click', quitarTodosLosDescuentos);

$('listaProductos').addEventListener('click', function (e) {
  var btn = e.target.closest('[data-accion]');
  if (!btn) return;
  var i = parseInt(btn.getAttribute('data-i'), 10);
  var accion = btn.getAttribute('data-accion');
  if (accion === 'editar') abrirEdicion(i);
  else if (accion === 'borrar') borrarProducto(i);
  else if (accion === 'guardar') guardarEdicion(i);
});

mostrarEstadoConfig();
</script>
