<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuzu — Catálogo</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
    --accent: #c8f135;
    --accent-dark: #9db82a;
    --radius: 10px;
    --font: 'Space Grotesk', sans-serif;
    --mono: 'Space Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }
  .logo {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--accent);
  }
  .cart-btn {
    background: var(--accent);
    color: #0e0e0e;
    border: none;
    border-radius: var(--radius);
    padding: 8px 16px;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s;
  }
  .cart-btn:hover { background: var(--accent-dark); }
  .cart-count {
    background: #0e0e0e;
    color: var(--accent);
    border-radius: 50%;
    width: 18px;
    height: 18px;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  /* HERO */
  .hero {
    padding: 48px 24px 36px;
    border-bottom: 1px solid var(--border);
  }
  .hero h1 {
    font-family: var(--mono);
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -1px;
    margin-bottom: 12px;
  }
  .hero h1 span { color: var(--accent); }
  .hero p {
    color: var(--muted);
    font-size: 14px;
    max-width: 480px;
  }

  /* FILTROS */
  .filters {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 4px;
  }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 20px;
    padding: 6px 14px;
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0e0e0e; font-weight: 600; }

  /* SUBCATEGORÍAS */
  .subcats {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    display: none;
  }
  .subcats.visible { display: flex; }
  .subcat-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 20px;
    padding: 4px 12px;
    font-family: var(--font);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .subcat-btn:hover { border-color: var(--accent); color: var(--text); }
  .subcat-btn.active { border-color: var(--accent); color: var(--accent); }

  /* GRID */
  .catalog {
    padding: 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }

  /* CARD */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card-img {
    width: 100%;
    aspect-ratio: 1;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-img .placeholder {
    font-size: 48px;
    opacity: 0.15;
  }
  .card-cat-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(14,14,14,0.85);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px 8px;
    font-size: 10px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .card-body { padding: 12px; }
  .card-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-sub {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .card-prices { display: flex; flex-direction: column; gap: 1px; }
  .price-basic { font-size: 11px; color: var(--muted); }
  .price-standard { font-size: 14px; font-weight: 600; color: var(--accent); }
  .add-btn {
    background: var(--accent);
    color: #0e0e0e;
    border: none;
    border-radius: 6px;
    width: 32px;
    height: 32px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .add-btn:hover { background: var(--accent-dark); }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    width: 100%;
    max-width: 480px;
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(12px);
    transition: transform 0.2s;
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-img {
    width: 100%;
    aspect-ratio: 1;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px 14px 0 0;
    overflow: hidden;
  }
  .modal-img img { width: 100%; height: 100%; object-fit: cover; }
  .modal-img .placeholder { font-size: 80px; opacity: 0.1; }
  .modal-body { padding: 20px; }
  .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .modal-cat { font-size: 12px; color: var(--muted); margin-bottom: 20px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }

  .field-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: var(--mono);
    margin-bottom: 8px;
    display: block;
  }

  /* Tipo */
  .tipo-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  .tipo-opt {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tipo-opt:hover { border-color: var(--accent); }
  .tipo-opt.selected { border-color: var(--accent); background: rgba(200,241,53,0.07); }
  .tipo-opt-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .tipo-opt-detail { font-size: 11px; color: var(--muted); }
  .tipo-opt-price { font-size: 15px; font-weight: 600; color: var(--accent); margin-top: 6px; }

  /* Talla */
  .size-grid {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .size-btn {
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    border-radius: 6px;
    padding: 6px 14px;
    font-family: var(--font);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .size-btn:hover { border-color: var(--accent); }
  .size-btn.selected { border-color: var(--accent); background: rgba(200,241,53,0.07); color: var(--accent); font-weight: 600; }

  /* Color */
  .color-grid {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .color-opt {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color 0.15s;
    position: relative;
  }
  .color-opt.selected { border-color: var(--accent); }
  .color-opt::after {
    content: attr(data-name);
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .color-opt:hover::after, .color-opt.selected::after { opacity: 1; }

  .modal-actions { display: flex; gap: 10px; }
  .btn-add-cart {
    flex: 1;
    background: var(--accent);
    color: #0e0e0e;
    border: none;
    border-radius: var(--radius);
    padding: 14px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-add-cart:hover { background: var(--accent-dark); }
  .btn-close-modal {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-family: var(--font);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-close-modal:hover { color: var(--text); border-color: var(--text); }

  /* CARRITO DRAWER */
  .cart-drawer {
    position: fixed;
    right: 0;
    top: 0;
    bottom: 0;
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 300;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.25s;
  }
  .cart-drawer.open { transform: translateX(0); }
  .cart-header {
    padding: 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cart-header h2 { font-size: 16px; font-weight: 600; }
  .close-cart {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }
  .close-cart:hover { color: var(--text); }
  .cart-items { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .cart-empty { color: var(--muted); font-size: 14px; text-align: center; margin-top: 40px; }
  .cart-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .ci-info { flex: 1; }
  .ci-name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .ci-detail { font-size: 11px; color: var(--muted); line-height: 1.6; }
  .ci-price { font-size: 13px; color: var(--accent); font-weight: 600; white-space: nowrap; }
  .ci-remove {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    margin-left: 4px;
  }
  .ci-remove:hover { color: #ff5555; }
  .cart-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
  }
  .cart-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .cart-total-label { font-size: 13px; color: var(--muted); }
  .cart-total-price { font-size: 20px; font-weight: 700; color: var(--accent); }
  .btn-whatsapp {
    width: 100%;
    background: #25d366;
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 14px;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s;
  }
  .btn-whatsapp:hover { background: #1da851; }
  .btn-whatsapp svg { width: 20px; height: 20px; fill: #fff; }
  .cart-note { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; line-height: 1.5; }

  /* EMPTY STATE */
  .empty-state {
    grid-column: 1/-1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 14px;
  }

  /* OVERLAY CARRITO */
  .cart-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 299;
    display: none;
  }
  .cart-overlay.open { display: block; }

  @media (max-width: 480px) {
    .catalog { padding: 16px; gap: 12px; }
    .hero { padding: 32px 16px 24px; }
    .filters, .subcats { padding: 12px 16px; }
    header { padding: 0 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">YUZU</div>
  <button class="cart-btn" onclick="openCart()">
    🛒 Carrito <span class="cart-count" id="cartCount">0</span>
  </button>
</header>

<section class="hero">
  <h1>Streetwear<br><span>hecho en CR.</span></h1>
  <p>Print on demand. Elegís el diseño, la talla y el color — te llega a la puerta.</p>
</section>

<div class="filters">
  <span class="filter-label">Categoría</span>
  <button class="filter-btn active" onclick="filterCat('all', this)">Todos</button>
  <button class="filter-btn" onclick="filterCat('anime', this)">Anime</button>
  <button class="filter-btn" onclick="filterCat('urbano', this)">Urbano</button>
  <button class="filter-btn" onclick="filterCat('religioso', this)">Religioso</button>
  <button class="filter-btn" onclick="filterCat('cultura-pop', this)">Cultura Pop</button>
</div>

<div class="subcats" id="subcats">
  <span class="filter-label">Serie</span>
</div>

<main class="catalog" id="catalog"></main>

<!-- MODAL PRODUCTO -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" id="modal">
    <div class="modal-img" id="modalImg">
      <span class="placeholder">👕</span>
    </div>
    <div class="modal-body">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-cat" id="modalCat"></div>

      <label class="field-label">Tipo de camiseta</label>
      <div class="tipo-grid" id="tipoGrid">
        <div class="tipo-opt selected" onclick="selectTipo(this, 'basica', 15500)" data-price="15500" data-tipo="basica">
          <div class="tipo-opt-name">Básica</div>
          <div class="tipo-opt-detail">160g · XS a 3XL</div>
          <div class="tipo-opt-price">₡15,500</div>
        </div>
        <div class="tipo-opt" onclick="selectTipo(this, 'estandar', 19500)" data-price="19500" data-tipo="estandar">
          <div class="tipo-opt-name">Estándar</div>
          <div class="tipo-opt-detail">190g · S a XL</div>
          <div class="tipo-opt-price">₡19,500</div>
        </div>
      </div>

      <label class="field-label">Talla</label>
      <div class="size-grid" id="sizeGrid"></div>

      <label class="field-label" style="margin-top:20px;">Color</label>
      <div class="color-grid" id="colorGrid">
        <div class="color-opt selected" style="background:#ffffff; box-shadow: inset 0 0 0 1px #444;" data-name="Blanco" onclick="selectColor(this, 'Blanco')"></div>
        <div class="color-opt" style="background:#1a1a1a;" data-name="Negro" onclick="selectColor(this, 'Negro')"></div>
        <div class="color-opt" style="background:#e8dcc8;" data-name="Beige" onclick="selectColor(this, 'Beige')"></div>
        <div class="color-opt" style="background:#4a4a4a;" data-name="Gris grafito" onclick="selectColor(this, 'Gris grafito')"></div>
        <div class="color-opt" style="background:#1b3a5c;" data-name="Azul marino" onclick="selectColor(this, 'Azul marino')"></div>
        <div class="color-opt" style="background:#4a6741;" data-name="Verde musgo" onclick="selectColor(this, 'Verde musgo')"></div>
      </div>

      <div class="modal-actions">
        <button class="btn-close-modal" onclick="closeModal()">Cancelar</button>
        <button class="btn-add-cart" onclick="addToCart()">Agregar al carrito</button>
      </div>
    </div>
  </div>
</div>

<!-- CARRITO -->
<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h2>Tu pedido</h2>
    <button class="close-cart" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="cart-empty">Tu carrito está vacío</div>
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span class="cart-total-label">Total</span>
      <span class="cart-total-price" id="cartTotal">₡0</span>
    </div>
    <button class="btn-whatsapp" onclick="sendWhatsApp()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Pedir por WhatsApp
    </button>
    <p class="cart-note">Te vamos a confirmar el pedido y coordinar el pago por WhatsApp.</p>
  </div>
</div>

<script>
const WHATSAPP = '50661984904';

const PRODUCTOS = [
  // ANIME
  { id: 1, nombre: 'Afro Samurai', cat: 'anime', subcat: 'Afro Samurai', img: null },
  { id: 2, nombre: 'Aggretsuko', cat: 'anime', subcat: 'Aggretsuko', img: null },
  { id: 3, nombre: 'Akame ga Kill', cat: 'anime', subcat: 'Akame ga Kill', img: null },
  { id: 4, nombre: 'Akira', cat: 'anime', subcat: 'Akira', img: null },
  { id: 5, nombre: 'Angel Beats', cat: 'anime', subcat: 'Angel Beats', img: null },
  { id: 6, nombre: 'Another', cat: 'anime', subcat: 'Another', img: null },
  { id: 7, nombre: 'Assassination Classroom', cat: 'anime', subcat: 'Assassination Classroom', img: null },
  { id: 8, nombre: 'Astro Boy', cat: 'anime', subcat: 'Astro Boy', img: null },
  { id: 9, nombre: 'Attack on Titan', cat: 'anime', subcat: 'Attack on Titan', img: null },
  { id: 10, nombre: 'Avatar', cat: 'anime', subcat: 'Avatar', img: null },
  { id: 11, nombre: 'Baki', cat: 'anime', subcat: 'Baki', img: null },
  { id: 12, nombre: 'Berserk', cat: 'anime', subcat: 'Berserk', img: null },
  { id: 13, nombre: 'Black Butler', cat: 'anime', subcat: 'Black Butler', img: null },
  { id: 14, nombre: 'Black Clover', cat: 'anime', subcat: 'Black Clover', img: null },
  { id: 15, nombre: 'Bleach', cat: 'anime', subcat: 'Bleach', img: null },
  { id: 16, nombre: 'Blue Exorcist', cat: 'anime', subcat: 'Blue Exorcist', img: null },
  { id: 17, nombre: 'Bluelock', cat: 'anime', subcat: 'Bluelock', img: null },
  { id: 18, nombre: 'Boku no Hero', cat: 'anime', subcat: 'Boku no Hero', img: null },
  { id: 19, nombre: 'Chainsaw Man', cat: 'anime', subcat: 'Chainsaw Man', img: null },
  { id: 20, nombre: 'Cowboy Bebop', cat: 'anime', subcat: 'Cowboy Bebop', img: null },
  { id: 21, nombre: 'Cyberpunk Edgerunners', cat: 'anime', subcat: 'Cyberpunk Edgerunners', img: null },
  { id: 22, nombre: 'DBZ', cat: 'anime', subcat: 'DBZ', img: null },
  { id: 23, nombre: 'Jujutsu Kaisen', cat: 'anime', subcat: 'Jujutsu Kaisen', img: null },
  { id: 24, nombre: 'One Piece', cat: 'anime', subcat: 'One Piece', img: null },
  // CULTURA POP
  { id: 25, nombre: 'Spider-Man — Miles Morales', cat: 'cultura-pop', subcat: 'Marvel', img: null },
  { id: 26, nombre: 'Spider-Man — Spectacular', cat: 'cultura-pop', subcat: 'Marvel', img: null },
  { id: 27, nombre: 'Spider-Man — Noir', cat: 'cultura-pop', subcat: 'Marvel', img: null },
  { id: 28, nombre: 'Spider-Man — Tobey Maguire', cat: 'cultura-pop', subcat: 'Marvel', img: null },
  { id: 29, nombre: 'Spider-Man — Tom Holland', cat: 'cultura-pop', subcat: 'Marvel', img: null },
  // URBANO
  { id: 30, nombre: 'Diseño Urbano 01', cat: 'urbano', subcat: 'Urbano', img: null },
  // RELIGIOSO
  { id: 31, nombre: 'Diseño Religioso 01', cat: 'religioso', subcat: 'Religioso', img: null },
];

const SIZES_BASICA = ['XS','S','M','L','XL','2XL','3XL'];
const SIZES_ESTANDAR = ['S','M','L','XL'];

let currentCat = 'all';
let currentSubcat = 'all';
let cart = [];
let currentProduct = null;
let selectedTipo = 'basica';
let selectedPrice = 15500;
let selectedSize = null;
let selectedColor = 'Blanco';

function getSubcats(cat) {
  const subs = [...new Set(PRODUCTOS.filter(p => p.cat === cat).map(p => p.subcat))];
  return subs.sort();
}

function filterCat(cat, btn) {
  currentCat = cat;
  currentSubcat = 'all';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const subcatsEl = document.getElementById('subcats');
  if (cat === 'anime') {
    const subs = getSubcats('anime');
    subcatsEl.innerHTML = '<span class="filter-label">Serie</span>';
    const allBtn = document.createElement('button');
    allBtn.className = 'subcat-btn active';
    allBtn.textContent = 'Todas';
    allBtn.onclick = () => filterSubcat('all', allBtn);
    subcatsEl.appendChild(allBtn);
    subs.forEach(s => {
      const b = document.createElement('button');
      b.className = 'subcat-btn';
      b.textContent = s;
      b.onclick = () => filterSubcat(s, b);
      subcatsEl.appendChild(b);
    });
    subcatsEl.classList.add('visible');
  } else {
    subcatsEl.classList.remove('visible');
  }
  renderCatalog();
}

function filterSubcat(sub, btn) {
  currentSubcat = sub;
  document.querySelectorAll('.subcat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderCatalog();
}

function renderCatalog() {
  const catalog = document.getElementById('catalog');
  let prods = PRODUCTOS;
  if (currentCat !== 'all') prods = prods.filter(p => p.cat === currentCat);
  if (currentSubcat !== 'all') prods = prods.filter(p => p.subcat === currentSubcat);

  if (prods.length === 0) {
    catalog.innerHTML = '<div class="empty-state">No hay diseños en esta categoría todavía.</div>';
    return;
  }

  const catLabels = { anime: 'Anime', 'cultura-pop': 'Cultura Pop', urbano: 'Urbano', religioso: 'Religioso' };

  catalog.innerHTML = prods.map(p => `
    <div class="card" onclick="openModal(${p.id})">
      <div class="card-img">
        ${p.img ? `<img src="${p.img}" alt="${p.nombre}" loading="lazy">` : '<span class="placeholder">👕</span>'}
        <span class="card-cat-badge">${catLabels[p.cat] || p.cat}</span>
      </div>
      <div class="card-body">
        <div class="card-name">${p.nombre}</div>
        <div class="card-sub">${p.subcat}</div>
        <div class="card-footer">
          <div class="card-prices">
            <span class="price-basic">Básica ₡15,500</span>
            <span class="price-standard">Estándar ₡19,500</span>
          </div>
          <button class="add-btn" onclick="event.stopPropagation(); openModal(${p.id})">+</button>
        </div>
      </div>
    </div>
  `).join('');
}

function openModal(id) {
  currentProduct = PRODUCTOS.find(p => p.id === id);
  if (!currentProduct) return;
  selectedTipo = 'basica';
  selectedPrice = 15500;
  selectedSize = null;
  selectedColor = 'Blanco';

  const catLabels = { anime: 'Anime', 'cultura-pop': 'Cultura Pop', urbano: 'Urbano', religioso: 'Religioso' };
  document.getElementById('modalTitle').textContent = currentProduct.nombre;
  document.getElementById('modalCat').textContent = `${catLabels[currentProduct.cat]} · ${currentProduct.subcat}`;

  const imgEl = document.getElementById('modalImg');
  imgEl.innerHTML = currentProduct.img
    ? `<img src="${currentProduct.img}" alt="${currentProduct.nombre}">`
    : '<span class="placeholder">👕</span>';

  document.querySelectorAll('.tipo-opt').forEach(o => o.classList.remove('selected'));
  document.querySelector('[data-tipo="basica"]').classList.add('selected');

  renderSizes(SIZES_BASICA);

  document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('selected'));
  document.querySelector('.color-opt').classList.add('selected');

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderSizes(sizes) {
  document.getElementById('sizeGrid').innerHTML = sizes.map(s =>
    `<button class="size-btn${selectedSize === s ? ' selected' : ''}" onclick="selectSize(this, '${s}')">${s}</button>`
  ).join('');
}

function selectTipo(el, tipo, price) {
  document.querySelectorAll('.tipo-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedTipo = tipo;
  selectedPrice = price;
  selectedSize = null;
  renderSizes(tipo === 'basica' ? SIZES_BASICA : SIZES_ESTANDAR);
}

function selectSize(el, size) {
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  selectedSize = size;
}

function selectColor(el, color) {
  document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedColor = color;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function addToCart() {
  if (!selectedSize) { alert('Por favor elegí una talla.'); return; }
  cart.push({
    id: Date.now(),
    nombre: currentProduct.nombre,
    tipo: selectedTipo === 'basica' ? 'Básica 160g' : 'Estándar 190g',
    talla: selectedSize,
    color: selectedColor,
    precio: selectedPrice
  });
  updateCart();
  closeModal();
  openCart();
}

function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  updateCart();
}

function updateCart() {
  document.getElementById('cartCount').textContent = cart.length;
  const total = cart.reduce((s, i) => s + i.precio, 0);
  document.getElementById('cartTotal').textContent = '₡' + total.toLocaleString('es-CR');

  const itemsEl = document.getElementById('cartItems');
  if (cart.length === 0) {
    itemsEl.innerHTML = '<div class="cart-empty">Tu carrito está vacío</div>';
    return;
  }
  itemsEl.innerHTML = cart.map(i => `
    <div class="cart-item">
      <div class="ci-info">
        <div class="ci-name">${i.nombre}</div>
        <div class="ci-detail">${i.tipo} · Talla ${i.talla} · ${i.color}</div>
      </div>
      <div style="display:flex;align-items:center;gap:4px;">
        <span class="ci-price">₡${i.precio.toLocaleString('es-CR')}</span>
        <button class="ci-remove" onclick="removeFromCart(${i.id})">✕</button>
      </div>
    </div>
  `).join('');
}

function openCart() {
  document.getElementById('cartDrawer').classList.add('open');
  document.getElementById('cartOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeCart() {
  document.getElementById('cartDrawer').classList.remove('open');
  document.getElementById('cartOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function sendWhatsApp() {
  if (cart.length === 0) { alert('Tu carrito está vacío.'); return; }
  const total = cart.reduce((s, i) => s + i.precio, 0);
  let msg = '¡Hola! Quiero hacer el siguiente pedido en Yuzu:\n\n';
  cart.forEach((i, idx) => {
    msg += `${idx + 1}. ${i.nombre}\n   ${i.tipo} · Talla ${i.talla} · ${i.color}\n   ₡${i.precio.toLocaleString('es-CR')}\n\n`;
  });
  msg += `*Total: ₡${total.toLocaleString('es-CR')}*\n\n¿Cómo coordino el pago y el envío?`;
  const url = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
  window.open(url, '_blank');
}

renderCatalog();
</script>
</body>
</html>
